# @package _global_

defaults:
  - rl_grpo_dapo17k_async_eval
  - _self_

placement_type: disaggregated

training:
  single_controller: True
  async_rollout: True
  use_external_reward: True
  rollout_max_staleness: 1
  load_aware_sampler_dispatch_stagger_s: 0.5

policy:
  dist_config:
    nnodes: 1

sampler:
  dist_config:
    nnodes: 1
  infer_engine_configs:
    - dist_config:
        nnodes: 1
        tensor_model_parallel_size: 2
        pipeline_model_parallel_size: 1
      use_fast_tokenizer: True
      gpu_memory_utilization: 0.7
      max_running_requests: 128
      temperature: 1.0
      top_p: 1.0
      eval_generate_params:
        temperature: 1.0
        top_k: 1
        top_p: 1.0
        min_p: 0.0
      generate_max_tokens: 3072

external_reward:
  async_eval: True
  eval_delay_s: -1
  reward_info:
    - reward_py_path: tasks/math_rl_v4/math_external_reward_dapo.py
      reward_cls_name: DapoMathRuleExternalReward
      reward_weight: 1.0

checkpoint:
  save_ckpt_path: "tests/single_ctrl_async_eval_smoke_ckpt"
